[project]
name = "emotion-aware-ca"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "librosa>=0.11.0",
    "pandas>=3.0.3",
    "torch>=2.11; sys_platform == 'darwin'",
    "torch==2.11.0+cu128; sys_platform != 'darwin'",
    "tqdm>=4.66.5",
    "scikit-learn>=1.4",
    "optuna>=4.0",
    "noisereduce>=3.0",
    "faster-whisper>=1.0",
    "transformers>=5.12.1",
    "livekit-agents[openai]~=1.5",
    "livekit-plugins-silero~=1.5",
    "livekit-api~=1.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-dotenv>=1.0",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform != 'darwin'" }
]
