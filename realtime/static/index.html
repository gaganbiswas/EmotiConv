<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Emotion-aware conversation</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #18201d;
        --muted: #69746f;
        --paper: #f4f0e8;
        --panel: #fffdf8;
        --line: #d8ddd4;
        --teal: #0f766e;
        --teal-dark: #115e59;
        --coral: #df755e;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        height: 100vh;
        overflow: hidden;
        color: var(--ink);
        background:
          radial-gradient(circle at 8% 8%, #e5eee5 0 18%, transparent 42%),
          var(--paper);
        font-family: "Avenir Next", "Segoe UI", sans-serif;
      }
      main {
        width: min(1180px, calc(100% - 40px));
        height: 100vh;
        margin: auto;
        padding: 42px 0 56px;
        overflow: hidden;
      }
      header {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 24px;
        margin-bottom: 28px;
      }
      .eyebrow {
        margin: 0 0 8px;
        color: var(--coral);
        font:
          700 0.72rem/1 "Courier New",
          monospace;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0;
        font:
          500 clamp(2.2rem, 5vw, 4.5rem)/0.98 Georgia,
          serif;
      }
      .status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--muted);
        font-size: 0.9rem;
      }
      .connection-dot {
        width: 9px;
        height: 9px;
        flex: 0 0 9px;
        border-radius: 50%;
        background: var(--coral);
        box-shadow: 0 0 0 3px #df755e24;
      }
      .status.connected .connection-dot {
        background: #2f9e5b;
        box-shadow: 0 0 0 3px #2f9e5b24;
      }
      .workspace {
        display: grid;
        grid-template-columns: 280px minmax(0, 1fr);
        height: calc(100% - 104px);
        min-height: 0;
        gap: 18px;
      }
      .panel {
        background: color-mix(in srgb, var(--panel) 92%, transparent);
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: 0 18px 50px #24433a18;
      }
      .controls {
        padding: 22px;
        align-self: start;
      }
      h2 {
        margin: 0 0 20px;
        font:
          600 1.15rem Georgia,
          serif;
      }
      label {
        display: block;
        margin: 17px 0 7px;
        color: var(--muted);
        font-size: 0.76rem;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      select,
      input {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 5px;
        background: #fff;
        color: var(--ink);
        padding: 11px 12px;
        font: inherit;
      }
      select:disabled {
        color: var(--muted);
        background: #f0f2ed;
      }
      .conversation {
        min-height: 0;
        height: 100%;
        display: grid;
        grid-template-rows: auto 1fr auto auto;
        overflow: hidden;
      }
      .conversation-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 20px 22px;
        border-bottom: 1px solid var(--line);
      }
      .conversation-head h2 {
        margin: 0;
      }
      #messages {
        min-height: 0;
        overflow: auto;
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .message-row {
        max-width: min(78%, 620px);
        display: flex;
        flex-direction: column;
      }
      .message-row.user {
        align-self: flex-end;
        align-items: flex-end;
      }
      .message-row.assistant {
        align-self: flex-start;
        align-items: flex-start;
      }
      .message {
        max-width: 100%;
        padding: 12px 15px;
        border-radius: 8px;
        line-height: 1.45;
        white-space: pre-wrap;
      }
      .message.user {
        color: #fff;
        background: var(--teal);
        border-bottom-right-radius: 2px;
      }
      .message.assistant {
        background: #e8eee6;
        border-bottom-left-radius: 2px;
      }
      .empty {
        margin: auto;
        max-width: 28ch;
        color: var(--muted);
        text-align: center;
        line-height: 1.5;
      }
      #save {
        width: 100%;
        margin-top: 24px;
        padding: 12px;
        border: 0;
        border-radius: 5px;
        color: #fff;
        background: var(--teal);
        cursor: pointer;
      }
      #save:disabled {
        cursor: default;
        opacity: 0.5;
      }
      .emotion-toggle {
        display: flex;
        align-items: center;
        gap: 9px;
        margin-top: 20px;
        color: var(--muted);
        font-size: 0.85rem;
      }
      .emotion-toggle input {
        width: auto;
        accent-color: var(--teal);
      }
      .detected-emotion {
        display: block;
        margin-top: 6px;
        padding: 0 2px;
        color: #4f5753;
        font-size: 0.68rem;
        font-style: italic;
        text-align: right;
      }
      .detected-emotion[hidden] {
        display: none;
      }
      .talk-row {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 14px 20px 20px;
        border-top: 1px solid var(--line);
      }
      #ptt {
        width: 52px;
        height: 52px;
        border: 0;
        border-radius: 50%;
        color: #fff;
        background: var(--teal);
        box-shadow: 0 0 0 5px #0f766e20;
        cursor: pointer;
      }
      #ptt svg {
        width: 22px;
        height: 22px;
        vertical-align: middle;
      }
      #ptt[data-talking="true"] {
        background: var(--coral);
        box-shadow: 0 0 0 7px #df755e35;
      }
      #ptt:disabled {
        cursor: default;
        opacity: 0.5;
      }
      #talk-status {
        color: var(--muted);
        font-size: 0.84rem;
      }
      @media (max-width: 760px) {
        main {
          width: min(100% - 24px, 600px);
          height: 100dvh;
          padding-top: 24px;
          padding-bottom: 24px;
        }
        header {
          display: block;
        }
        .status {
          margin-top: 12px;
        }
        .workspace {
          grid-template-columns: 1fr;
          height: calc(100% - 128px);
          grid-template-rows: auto minmax(0, 1fr);
          overflow: hidden;
        }
        .controls {
          max-height: 210px;
          overflow: auto;
        }
        .conversation {
          min-height: 0;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>EmotiConv</h1>
        </div>
        <div class="status" id="status">
          <span class="connection-dot" aria-hidden="true"></span>
          <span id="status-text">Connecting...</span>
        </div>
      </header>
      <div class="workspace">
        <aside class="panel controls">
          <h2>Conversation setup</h2>
          <label for="llm">Language model</label
          ><select id="llm"></select>
          <label for="tts">Voice model</label
          ><select id="tts"></select>
          <label for="stt">Speech recognition</label
          ><select id="stt"></select>
          <label class="emotion-toggle" for="show-emotion">
            <input id="show-emotion" type="checkbox" />
            Show detected emotion
          </label>
          <button id="save" disabled>Save and restart</button>
        </aside>
        <section class="panel conversation" aria-live="polite">
          <div class="conversation-head">
            <h2>Conversation</h2>
          </div>
          <div id="messages">
            <div class="empty" id="empty">
              Your messages and the agent's replies will appear here.
            </div>
          </div>
          <div class="talk-row">
            <button
              id="ptt"
              data-talking="false"
              disabled
              aria-label="Hold the button or space to speak"
            >
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
                focusable="false"
              >
                <rect x="9" y="2" width="6" height="12" rx="3" />
                <path d="M5 10a7 7 0 0 0 14 0" />
                <line x1="12" y1="19" x2="12" y2="22" />
                <line x1="8" y1="22" x2="16" y2="22" />
              </svg></button
            ><span id="talk-status">Connecting...</span>
          </div>
        </section>
      </div>
      <audio id="agent-audio" autoplay></audio>
    </main>
    <script type="module">
      import {
        Room,
        RoomEvent,
        ParticipantKind,
      } from "https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.esm.mjs";
      const ids = [
        "llm",
        "tts",
        "stt",
        "show-emotion",
        "save",
        "status",
        "status-text",
        "messages",
        "empty",
        "ptt",
        "talk-status",
        "agent-audio",
      ];
      const els = Object.fromEntries(
        ids.map((id) => [id, document.getElementById(id)]),
      );
      const setConnectionStatus = (text, connected = false) => {
        els["status-text"].textContent = text;
        els.status.classList.toggle("connected", connected);
      };
      const voice = {
        room: null,
        agentId: null,
        talking: false,
        started: false,
        connecting: false,
        restart: 0,
        roomName: null,
        latestUserMessage: null,
      };
      const isAgent = (p) =>
        p.kind === ParticipantKind.AGENT ||
        p.isAgent ||
        (p.identity || "").startsWith("agent");
      const addMessage = (role, text) => {
        els.empty.hidden = true;
        const row = document.createElement("div");
        row.className = `message-row ${role}`;
        const item = document.createElement("div");
        item.className = `message ${role}`;
        item.textContent = text;
        row.append(item);
        els.messages.append(row);
        els.messages.scrollTop = els.messages.scrollHeight;
        return row;
      };
      const setEmotionVisibility = (visible) => {
        document.querySelectorAll(".detected-emotion").forEach((item) => {
          item.hidden = !visible;
        });
      };
      const showEmotion = (label, confidence) => {
        if (!voice.latestUserMessage) return;
        let item = voice.latestUserMessage.querySelector(".detected-emotion");
        if (!item) {
          item = document.createElement("span");
          item.className = "detected-emotion";
          voice.latestUserMessage.append(item);
        }
        item.textContent = `${label} (${(confidence * 100).toFixed(0)}%)`;
        item.hidden = !els["show-emotion"].checked;
      };
      const modelLabels = {
        "google/gemini-2.5-flash": "Gemini 2.5 Flash",
        "cartesia/sonic-2": "Sonic 2",
        "cartesia/sonic-3": "Sonic 3",
        "whisper-local": "Whisper (local)",
      };
      const setOptions = (select, values, defaultValue) => {
        select.replaceChildren(
          ...values.map((value) => {
            const option = document.createElement("option");
            option.value = value;
            option.textContent = modelLabels[value] || value;
            return option;
          }),
        );
        select.value = values.includes(defaultValue) ? defaultValue : values[0];
      };
      async function loadModels() {
        const response = await fetch("/models");
        const models = await response.json();
        setOptions(els.llm, models.llm, "google/gemini-2.5-flash");
        setOptions(els.tts, models.tts, "cartesia/sonic-2");
        setOptions(els.stt, models.stt, "whisper-local");
      }
      function handleData(payload, topic) {
        const text = new TextDecoder().decode(payload);
        if (topic === "chat") {
          try {
            const message = JSON.parse(text);
            const item = addMessage(message.role, message.text);
            if (message.role === "user") voice.latestUserMessage = item;
          } catch (_) {}
        }
        if (topic === "emotion") {
          try {
            const emotion = JSON.parse(text);
            showEmotion(emotion.label, emotion.scores[emotion.label]);
          } catch (_) {}
        }
        if (topic === "agent_state" && text === "listening")
          els["talk-status"].textContent = "Hold the button or space to speak.";
        if (topic === "notice" && text === "no_speech")
          els["talk-status"].textContent = "No speech detected. Try again.";
      }
      async function rpc(method, payload = "") {
        const deadline = Date.now() + 10000;
        while (!voice.agentId && voice.room && Date.now() < deadline) {
          await new Promise((resolve) => setTimeout(resolve, 50));
        }
        if (!voice.agentId || !voice.room)
          throw new Error("The agent is still connecting.");
        await voice.room.localParticipant.performRpc({
          destinationIdentity: voice.agentId,
          method,
          payload,
        });
      }
      function selectedConfig() {
        return {
          llm_model: els.llm.value,
          tts_model: els.tts.value,
          stt_model: els.stt.value,
        };
      }
      function resetConversation() {
        els.messages.replaceChildren(els.empty);
        els.empty.hidden = false;
        voice.latestUserMessage = null;
        els.ptt.disabled = true;
        els["talk-status"].textContent = "Connecting...";
      }
      async function disconnect() {
        if (voice.room) {
          try {
            await voice.room.disconnect();
          } catch (_) {}
        }
        voice.room = null;
        voice.agentId = null;
        voice.talking = false;
        voice.started = false;
      }
      async function connect() {
        const attempt = ++voice.restart;
        voice.connecting = true;
        await disconnect();
        resetConversation();
        setConnectionStatus("Connecting...");
        const config = {
          ...selectedConfig(),
        };
        const setup = await fetch("/control/session", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(config),
        });
        if (!setup.ok) {
          throw new Error("configuration rejected");
        }
        if (attempt !== voice.restart) return;
        const tokenResponse = await fetch("/token");
        if (!tokenResponse.ok) {
          throw new Error("session unavailable");
        }
        const { url, token, room } = await tokenResponse.json();
        voice.roomName = room;
        if (attempt !== voice.restart) return;
        voice.room = new Room();
        voice.room.on(RoomEvent.TrackSubscribed, (track) => {
          if (track.kind === "audio") track.attach(els["agent-audio"]);
        });
        voice.room.on(RoomEvent.ParticipantConnected, (p) => {
          if (isAgent(p)) {
            voice.agentId = p.identity;
            if (voice.started) els.ptt.disabled = false;
            setConnectionStatus("Connected to room. Agent connected.", true);
            els["talk-status"].textContent = "Waiting for the agent...";
          }
        });
        voice.room.on(RoomEvent.ParticipantDisconnected, (p) => {
          if (isAgent(p) && p.identity === voice.agentId) {
            voice.agentId = null;
            els.ptt.disabled = true;
            setConnectionStatus("Connected to room. Waiting for agent", true);
            els["talk-status"].textContent =
              "Agent disconnected. Waiting to reconnect...";
          }
        });
        voice.room.on(
          RoomEvent.DataReceived,
          (payload, _participant, _kind, topic) => handleData(payload, topic),
        );
        await voice.room.connect(url, token);
        await voice.room.localParticipant.setMicrophoneEnabled(true);
        if (attempt !== voice.restart) {
          await disconnect();
          return;
        }
        for (const p of voice.room.remoteParticipants.values())
          if (isAgent(p)) voice.agentId = p.identity;
        voice.started = true;
        els.ptt.disabled = !voice.agentId;
        setConnectionStatus(
          voice.agentId
            ? "Connected to room. Agent connected."
            : "Connected to room. Waiting for agent",
          true,
        );
        els["talk-status"].textContent = voice.agentId
          ? "Waiting for the agent..."
          : "Waiting for the agent to join...";
        voice.connecting = false;
      }
      async function startTalk() {
        if (!voice.started || voice.talking || els.ptt.disabled) return;
        voice.talking = true;
        els.ptt.dataset.talking = "true";
        els["talk-status"].textContent = "Listening...";
        await rpc("start_turn");
      }
      async function stopTalk() {
        if (!voice.talking) return;
        voice.talking = false;
        els.ptt.dataset.talking = "false";
        els["talk-status"].textContent = "Preparing a reply...";
        await rpc("end_turn");
      }
      els.ptt.onmousedown = startTalk;
      window.onmouseup = stopTalk;
      els.ptt.ontouchstart = (event) => {
        event.preventDefault();
        startTalk();
      };
      els.ptt.ontouchend = (event) => {
        event.preventDefault();
        stopTalk();
      };
      window.onkeydown = (event) => {
        if (event.code === "Space" && !event.repeat) {
          event.preventDefault();
          startTalk();
        }
      };
      window.onkeyup = (event) => {
        if (event.code === "Space") {
          event.preventDefault();
          stopTalk();
        }
      };
      async function restartSession() {
        els.save.disabled = true;
        try {
          await connect();
        } catch (error) {
          voice.connecting = false;
          setConnectionStatus(error.message || "Unable to connect.");
          els["talk-status"].textContent = "Connection unavailable.";
        } finally {
          els.save.disabled = false;
        }
      }
      els.save.addEventListener("click", restartSession);
      els["show-emotion"].addEventListener("change", (event) => {
        setEmotionVisibility(event.target.checked);
      });
      window.addEventListener("pagehide", () => {
        if (!voice.roomName) return;
        navigator.sendBeacon(
          "/control/session/end",
          new Blob([JSON.stringify({ room: voice.roomName })], {
            type: "application/json",
          }),
        );
      });
      loadModels()
        .then(() => {
          els.save.disabled = false;
          return restartSession();
        })
        .catch((error) => {
          setConnectionStatus(error.message || "Unable to connect.");
          els["talk-status"].textContent = "Connection unavailable.";
        });
    </script>
  </body>
</html>
